[project]
name = "wstg"
version = "0.1.0"
description = "Web tool to run OWASP WSTG tests: automatic evidence, per-step procedures, findings"
authors = [
    { name = "toku463ne", email = "toku463ne@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "flask>=3.1",
    "playwright>=1.49",
    "pyyaml>=6.0",
    "waitress>=3.0",
]

[project.scripts]
wstg = "wstg.cli:main"
wstg-har = "wstg.har:main"
wstg-dns = "wstg.dnscheck:main"
wstg-entry = "wstg.entrypoints:main"
wstg-trav = "wstg.traversal:main"
wstg-sess = "wstg.sessionscan:main"
wstg-reflect = "wstg.reflect:main"
wstg-cryp = "wstg.cryp:main"
wstg-timing = "wstg.timing:main"
wstg-ffuf = "wstg.ffufcheck:main"
wstg-ffuf-run = "wstg.ffufrun:main"
wstg-replay = "wstg.replay:main"
wstg-forge = "wstg.forge:main"
wstg-inject = "wstg.inject:main"
wstg-xxe = "wstg.xxe:main"

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: tests that deliberately wait several seconds (time-based probes)"]
