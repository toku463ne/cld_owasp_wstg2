[project]
name = "wstg"
version = "0.1.0"
description = "Web tool to run OWASP WSTG tests: automatic evidence, per-step procedures, findings"
authors = [
    { name = "toku463ne", email = "toku463ne@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "flask>=3.1",
    "pyyaml>=6.0",
    "waitress>=3.0",
]

[project.scripts]
wstg = "wstg.cli:main"
wstg-har = "wstg.har:main"

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
