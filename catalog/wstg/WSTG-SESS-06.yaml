id: WSTG-SESS-06
overview: >-
  Check that logging out invalidates the session on the server, not only by clearing the
  cookie in the browser, so the previous token cannot be reused afterwards.
pass: >-
  After logout the previous session token is rejected by the server for every request,
  and the session is also ended for the back button, other tabs, and other devices as
  appropriate.
fail: >-
  The previous session token is still accepted after logout (the server did not
  invalidate it), logout only clears the client cookie, or there is no clear logout.
notes:
  - The logout capture (`wstg capture` with `--role logout`) is separate from the main walk, which does not log out, so the other automatic checks keep a usable session.
  - Record a missing or hard-to-find logout control as a finding of its own.
finding_kinds: [weak-logout]
steps:
  - summary: Replay the session cookie after logout (from the logout capture)
    auto_run: true
    evidence: [logout-replay, har-logout]
    command: cat {ev:logout-replay}/stdout.txt
    operation: >-
      Automated: record the logout capture with `uv run wstg capture {fqdn} --role logout`
      (log in, open one page only a logged-in user sees, log out, press Enter), then
      collect logout-replay. It finds the logout, shows whether the logout response clears
      the cookie in the browser, and replays the pre-logout cookie against the pages seen
      before the logout: "still accepted" [FAIL] means the server did not end the session.
      Other tabs share the same cookie, so the same result applies to them.
  - summary: Check whether authenticated pages can be re-displayed from the cache (back button)
    auto_run: true
    evidence: [har-browse]
    command: wstg-har cache {ev:har-browse}/items/*.har
  - summary: Judge logout functionality
    evidence: [logout-replay, har-logout]
    ai_task: >-
      From steps 1 and 2 decide whether logout invalidates the session server-side.
      Verdict: fail when step 1 shows "still accepted" for the pre-logout cookie, or no
      logout was found in a capture that tried to log out (no clear logout control); pass
      when the old cookie is "rejected" after logout; "-" when logout-replay is missing,
      failed, or INCONCLUSIVE. A cookie not cleared in the browser while the server
      rejects it is a minor note, and CACHEABLE authenticated pages in step 2 (back button)
      belong to WSTG-ATHN-06; mention them but do not fail this test on them alone. Ending
      the session on another device is not judged here.
