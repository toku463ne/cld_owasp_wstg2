id: WSTG-INPV-01
overview: >-
  Check whether input from the URL or a form is reflected into the response without
  context-appropriate encoding, so a payload runs as script (reflected XSS). Test every
  reflection context: HTML body, attribute, JavaScript, and URL.
pass: >-
  Reflected input is encoded for its output context, so a payload is shown as text and
  never executes.
fail: >-
  Reflected input runs as script in any context (HTML, attribute, JavaScript, or URL),
  including through case, encoding, or event-handler filter bypasses.
notes:
  - This scenario checks the basic defence (output encoding plus browser-side headers) with a harmless marker; it does not try filter bypasses.
  - A partial WAF block is mitigation, not a fix.
finding_kinds: [reflected-xss]
steps:
  - summary: List parameters and form fields that may be reflected
    auto_run: true
    evidence: [katana-crawl]
    command: >-
      grep -oE '[?&][A-Za-z0-9_.-]+=' {ev:katana-crawl}/katana.txt 2>/dev/null | tr -d '?&=' | sort | uniq -c | sort -rn | head -40;
      grep -rhoiE '<(input|textarea|select)[^>]*name=["'"'"']?[A-Za-z0-9_.-]+' {ev:katana-crawl}/responses 2>/dev/null | sort -u | head -40
  - summary: Check whether reflected parameters are encoded (collected automatically)
    auto_run: true
    evidence: [reflection-check, katana-crawl, har-browse]
    command: cat {ev:reflection-check}/stdout.txt
    operation: >-
      Automated: reflection-check sends every GET parameter from the crawl and the main
      capture once with a harmless marker (a random word followed by < " ' >) and reports,
      per parameter, whether it is reflected and, in its output context (HTML text, a tag
      attribute, a script block), whether those characters come back raw
      (REFLECTED-UNENCODED) or encoded. Collect it after katana-crawl (and har-browse, so
      pages behind login are covered). Each parameter is sent once per page. An attribute
      counts only when the quote around its value comes back raw (a raw ' inside a
      "-quoted value is harmless); a script string when its own quote or < comes back raw;
      a value outside any string in a script block already runs as code.
  - summary: Check the browser-side XSS defences (CSP, nosniff, charset) from the capture
    auto_run: true
    evidence: [har-browse]
    command: wstg-har xss-headers {ev:har-browse}/items/*
  - summary: Confirm a REFLECTED-UNENCODED parameter in the browser (manual, optional)
    evidence: [xss-reflected-tests]
    operation: >-
      Optional, only for a parameter step 2 marks REFLECTED-UNENCODED and only if the
      engagement asks for a demonstration. Step 2 already holds the evidence: under each
      REFLECTED-UNENCODED line, the exact url sent (the page's other parameters keep their
      recorded values, so it opens the real screen) and the response around the marker.
      To show it: open that url in the browser where you are logged in as the role step 2
      names, press Ctrl+U, search for the wstg word, and save a screenshot of the source
      line (the page itself usually looks normal, since the marker is harmless) in
      xss-reflected-tests. Otherwise leave this empty.
  - summary: Judge reflected XSS (basic defence)
    evidence: [reflection-check, har-browse, xss-reflected-tests]
    ai_task: >-
      From steps 2 and 3 decide whether the basic defence against reflected XSS holds.
      Verdict: fail when any parameter is REFLECTED-UNENCODED on an HTML page (name the
      parameter and its context; note when step 3 shows no CSP that blocks inline script,
      which makes it worse); pass when every reflected parameter is encoded for its
      context; "-" when reflection-check is missing or failed, or no GET parameter was
      found. State that it was a marker-based check without filter-bypass attempts, and
      mention a missing or weak CSP from step 3 as a hardening note.
