id: WSTG-SESS-02
overview: >-
  Check the attributes of the session and authentication cookies: Secure, HttpOnly,
  SameSite, and a tight Domain and Path, so the cookie cannot be stolen over plain HTTP,
  read by JavaScript, or sent on cross-site requests.
pass: >-
  Session and authentication cookies set Secure and HttpOnly, a SameSite of Lax or
  Strict (or None only with a clear need), and the narrowest Domain and Path.
fail: >-
  A session or authentication cookie lacks Secure or HttpOnly, uses SameSite=None without
  need, or is scoped to a Domain or Path broader than required.
notes:
  - Judge the authenticated session cookie; do not confuse it with CSRF or tracking cookies, which may have different needs. Report per cookie name.
  - The __Host- and __Secure- prefixes imply Secure and a tight scope; note whether they are used where appropriate.
finding_kinds: [cookie-without-secure, cookie-missing-httponly, cookie-weak-samesite, cookie-scope-broad]
steps:
  - summary: Check the attributes of each anonymous Set-Cookie
    auto_run: true
    evidence: [session-token-samples]
    command: >-
      perl -ne 'next unless /^set-cookie:/i; my ($n)=/set-cookie:\s*([^=;]+)/i;
      my @miss; for my $a ("Secure","HttpOnly","SameSite"){ push @miss,$a unless /(?:;|\s)\Q$a\E\b/i }
      printf "%s: %s\n", $n, (@miss ? "MISSING ".join(",",@miss) : "Secure,HttpOnly,SameSite present")'
      {ev:session-token-samples}/stdout.txt | sort -u | head -40 || echo "no Set-Cookie header in the samples"
  - summary: Check the authenticated cookie attributes from the HAR
    auto_run: true
    evidence: [har-browse]
    command: wstg-har cookies {ev:har-browse}/items/*.har
  - summary: Review the authenticated session cookie attributes (manual)
    evidence: [cookie-attr-tests]
    operation: >-
      Using the HAR check above (step 2) and, if needed, a direct login
      (`curl -si -c cookies.txt --data '<login body>' {base_url}/<login>`), confirm for each
      session or authentication cookie: Secure, HttpOnly, SameSite, Domain, and Path, and
      any __Host-/__Secure- prefix. Record it in cookie-attr-tests, marking which cookies are
      session/auth versus CSRF or tracking.
  - summary: Judge the cookie attributes
    evidence: [cookie-attr-tests, session-token-samples]
    ai_task: >-
      From steps 1 to 3 decide, per session or authentication cookie, whether an attribute
      is weak. Verdict: fail when such a cookie lacks Secure or HttpOnly, uses SameSite=None
      without need, or is scoped too broadly; pass when all session/auth cookies set Secure,
      HttpOnly, a Lax/Strict SameSite, and a tight scope; "-" when no cookie evidence
      exists. Report each issue under the matching cookie finding kind, per cookie name.
