id: WSTG-ATHZ-01
overview: >-
  Check whether a parameter that names a file or path lets a request read or include a
  file outside the intended directory, through traversal sequences, absolute paths,
  encoded variants, or file inclusion.
pass: >-
  File and path parameters are validated or normalised (for example an allow-list) and a
  reference outside the intended directory is refused.
fail: >-
  A traversal sequence (../, ..\\), an absolute path, an encoded variant (%2e%2e%2f,
  double-encoded %252e, ....//), or a trailing extension or null byte reads an
  out-of-scope file, or an include parameter executes an arbitrary file.
notes:
  - Record only that an out-of-scope file could be read; keep the content of any sensitive file to the minimum needed to prove it, as a path reference.
  - Use documentation paths only as a proof target where possible; do not pull real secrets out of the system.
finding_kinds: [path-traversal, file-inclusion]
steps:
  - summary: Find parameters and paths that name a file (candidates from the crawl)
    auto_run: true
    evidence: [katana-crawl]
    command: >-
      grep -oiE '[?&](file|path|page|lang|template|include|doc|document|download|dir|folder|name|img|image|url|load|read|view)=[^&"'"'"'<> ]*'
      {ev:katana-crawl}/katana.txt 2>/dev/null | sort -u | head -60 || echo "no file-naming parameter seen in the crawl (look in the HAR and forms)"
  - summary: Send traversal and inclusion payloads to each file parameter (collected automatically)
    auto_run: true
    evidence: [traversal-probe, traversal-param-list, katana-crawl, har-browse]
    input_list: traversal-param-list
    collects: traversal-probe
    command: >-
      cat {ev:traversal-probe}/stdout.txt 2>/dev/null
      || echo "Not collected yet. Optionally type candidate URLs below, then press Save and collect."
    operation: >-
      Optional: type URLs with a file-naming parameter in the box (one per line, for
      example `{base_url}/page?file=home`) and press "Save and collect". Parameters found
      in the crawl and the HAR are added automatically. Each is sent its original value
      and a set of traversal / inclusion payloads, plus a remote file inclusion test (the
      tool runs a local callback server and asks the parameter to fetch a file from it): a
      line flagged TRAVERSAL returned a known file's content, CODE EXECUTION ran an included
      wrapper, and SSRF/RFI or REMOTE CODE EXECUTION means the parameter fetched (and ran)
      the remote file (see the excerpt). Collect it with the owner's agreement: it can trip
      a WAF, fill error logs, and makes the target fetch the callback.
    load_note: About ten payloads plus one remote-inclusion request per file-naming parameter (heavy). WSTG_PAUSE slows it down.
  - summary: Confirm log or session poisoning (manual, only if needed)
    evidence: [traversal-tests, traversal-probe]
    operation: >-
      The probe (step 2) already tests local traversal, local and data:// code execution,
      and remote file inclusion from its callback: a `CODE EXECUTION`, `REMOTE CODE
      EXECUTION`, or `SSRF/RFI` line is the finding. Do this step only for what it cannot
      do, and only with the owner's agreement: log or session poisoning. Send a request
      whose User-Agent (or another logged header, or a stored session value) is
      `<?php echo 31337*31337;?>`, then include the web server log or the session file
      through a file parameter (for example `.../access.log` or the PHP session path) and
      look for `982007569` in the response. Write each payload and result in traversal-tests,
      or mark that evidence collected with a comment saying it does not apply. Skip this
      step when step 2 already shows a fail.
  - summary: Judge directory traversal and file inclusion
    evidence: [traversal-tests, traversal-probe, katana-crawl]
    ai_task: >-
      From the traversal-probe output (step 2) and traversal-tests (step 3) decide whether any
      file parameter reads or includes an out-of-scope file. Verdict: fail when a traversal
      sequence, absolute path, or encoded variant returned an out-of-directory file, or an
      inclusion ran code - a probe "CODE EXECUTION", "REMOTE CODE EXECUTION", or "SSRF/RFI"
      line, or a log/session-poisoning result; pass when every parameter normalised or
      refused the reference; "-" when traversal-probe is missing. Report a traversal, a
      code-executing inclusion, and an SSRF separately.
