id: WSTG-SESS-09
overview: >-
  Check whether a session can be hijacked: whether a valid token, once obtained, can be
  reused from another device or network with no additional binding or verification, and
  whether the transport leaves it exposed to capture.
pass: >-
  A stolen token is of limited use: reuse from a new context triggers re-authentication
  or device binding, the token is short-lived, and the transport is encrypted so capture
  is hard; concurrent logins are detected.
fail: >-
  The same token works unchanged from another IP, browser, or user agent with full access
  (no binding, long-lived), or the token can be captured over an unencrypted channel.
notes:
  - Test only between the tester's own accounts and environments; never use another person's session.
  - Capture over an unencrypted channel is covered by WSTG-CRYP-01 and WSTG-SESS-02 (Secure); this test is about reuse once obtained.
finding_kinds: [session-hijacking]
steps:
  - summary: Check whether the transport protects the token
    auto_run: true
    evidence: [http-redirect-chain, tls-versions-curl]
    command: >-
      head -5 {ev:http-redirect-chain}/stdout.txt 2>/dev/null;
      grep -iE 'TLS1\.[0-3] [0-9]{3}' {ev:tls-versions-curl}/stdout.txt 2>/dev/null
      || echo "no transport evidence; see WSTG-CRYP-01"
  - summary: Check the session cookie attributes and lifetime from the capture
    auto_run: true
    evidence: [har-browse]
    command: wstg-har cookies {ev:har-browse}/items/*.har
    operation: >-
      Automated from the main capture (`uv run wstg capture {fqdn} --role user`); no
      request is sent. Secure keeps the token off plain HTTP, HttpOnly keeps it from
      scripts, SameSite limits cross-site use, and Max-Age/Expires marks a persistent
      (long-lived) cookie. Names and attributes only, never values.
  - summary: How long a stolen token stays usable (server-side timeouts from WSTG-SESS-07)
    auto_run: true
    evidence: [session-timeout]
    command: grep -E '^# ' {ev:session-timeout}/stdout.txt
    operation: >-
      Reuses the session-timeout measurement of WSTG-SESS-07 (idle and absolute timeout,
      and whether the server accepts the cookie after its own expiry). Collect it there.
  - summary: Reuse the token from another browser and check concurrent logins (manual, optional)
    evidence: [hijacking-tests]
    operation: >-
      Optional; steps 1 to 3 already give the transport, cookie protection, and lifetime.
      If the engagement needs it, with the tester's own test account only: use the session
      in a second browser (and, if possible, another network or user agent) at the same
      time as the first, note whether it works there and whether a second login is
      detected or ends the first, and record it in hijacking-tests. Otherwise leave this
      step empty.
  - summary: Judge session hijacking
    evidence: [har-browse, session-timeout, hijacking-tests]
    ai_task: >-
      From steps 1 to 4 decide how much a stolen token would allow. Verdict: fail when the
      token can be captured over an unencrypted channel (step 1, or no Secure in step 2),
      it is readable by scripts (no HttpOnly), it stays usable for long (step 3 marks an
      idle or absolute timeout LONG, or the server accepts the cookie after its own
      expiry), or step 4 shows it works unchanged from another browser or network with no
      re-authentication; pass when the transport is encrypted, the cookie is Secure and
      HttpOnly, and the server-side timeouts are reasonable; "-" when the HAR or
      session-timeout is missing. When hijacking-tests is missing, judge from steps 1 to 3
      and state that binding to the device or network and concurrent-login handling were
      not checked.
