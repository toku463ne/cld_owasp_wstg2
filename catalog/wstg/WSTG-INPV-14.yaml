id: WSTG-INPV-14
overview: >-
  Check for incubated vulnerabilities: input that is harmless when stored but fires later
  through another path, such as a stored payload executed by a batch job, report, admin
  screen, or external integration.
pass: >-
  Input is validated and encoded both when stored and when used, so no later path trusts
  the stored value.
fail: >-
  A value harmless at storage fires later on another path (batch, report, admin screen,
  or external system).
notes:
  - This is found by following business flows, not single-request tests; combine a storage weakness with a later trusted use.
  - A fire point on an admin screen or an external integration raises severity.
finding_kinds: [incubated-vulnerability]
steps:
  - summary: Map store-then-use paths from the flows and crawl
    auto_run: true
    evidence: [katana-crawl]
    command: >-
      grep -oiE '/(upload|import|report|export|batch|admin|notify|webhook|queue|job|print|pdf)[^ "'"'"'<>]*'
      {ev:katana-crawl}/katana.txt 2>/dev/null | sort -u | head -40 || echo "no obvious later-processing path in the crawl"
  - summary: Check stored markers on the later paths (from the capture; off-channel fire points manual)
    auto_run: true
    evidence: [har-browse, incubated-tests]
    command: wstg-har stored {ev:har-browse}/items/*
    operation: >-
      The HTML fire-point part reuses the stored-marker tracking of WSTG-INPV-02 from the
      capture (the tool stores nothing on the target). During the capture
      (`uv run wstg capture {fqdn} --role user`), with a test account, type a distinct
      marker such as `wstg01<"'>` into each field that is kept and later trusted, save it,
      then open the LATER-PROCESSING paths step 1 listed (report, export, admin screen,
      print/pdf preview) so the fire point is captured; if a different role or user renders
      the value, capture that role too (`--role admin`) and open the same pages there. The
      output lists, per marker, every captured response that shows it and whether `< " '`
      came back raw for its context (STORED-UNENCODED) or encoded - a value stored on one
      path and rendered raw on another path or to another role is the incubated case.
      OFF-CHANNEL fire points stay manual (record the chain in incubated-tests): a batch or
      cron job, a generated PDF/CSV, an email, a webhook, or an external system - these need
      the later process to be triggered and often an out-of-band observation. The judge
      (step 3) decides.
  - summary: Judge incubated vulnerability
    evidence: [har-browse, incubated-tests]
    ai_task: >-
      From step 2 decide whether a stored value fires on a later path. Use the stored-marker
      tracking from the capture (a marker stored on one path and shown STORED-UNENCODED on
      another path or to another role is an incubated HTML fire point) together with any
      off-channel chain recorded in incubated-tests. Verdict: fail when a value harmless at
      storage was executed or misused by a batch, report, admin screen, or external system;
      pass when input is validated and encoded at storage and use; "-" when no marker was
      stored and shown on a later path and incubated-tests is missing. Note the fire point
      (admin/external raises severity), and list later paths that were not captured.
