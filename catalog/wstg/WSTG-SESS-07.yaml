id: WSTG-SESS-07
overview: >-
  Check that a session expires after a reasonable idle period and an absolute lifetime,
  enforced on the server, so an unattended or long-lived session cannot be reused
  indefinitely.
pass: >-
  An idle timeout and an absolute timeout are enforced server-side, with lengths
  appropriate to the application's sensitivity; after expiry the token is rejected.
fail: >-
  There is no timeout, it is extremely long, or it is enforced only by the cookie's own
  expiry on the client while the server still accepts the token.
notes:
  - The timeout captures (`--role timeout`, and optionally `--role timeout-active`) are separate from the main walk; the other automatic checks never use them, so the idle timer is not reset by them.
  - A cookie expiry alone is a client control; the server must reject the token after the timeout.
finding_kinds: [weak-session-timeout]
steps:
  - summary: Read the session cookie expiry from the samples
    auto_run: true
    evidence: [session-token-samples]
    command: >-
      grep -iE '^set-cookie:' {ev:session-token-samples}/stdout.txt
      | grep -oiE '(max-age=[0-9]+|expires=[^;]+)' | sort -u | head
      || echo "session cookie is a session cookie (no Max-Age/Expires) or no Set-Cookie in the samples"
  - summary: Measure the idle and absolute timeouts server-side (collected automatically)
    auto_run: true
    evidence: [session-timeout, har-browse]
    command: cat {ev:session-timeout}/stdout.txt
    operation: >-
      Record `uv run wstg capture {fqdn} --role timeout` (log in, open one page only a
      logged-in user sees, press Enter without logging out) and, for the absolute
      timeout, `uv run wstg capture {fqdn} --role timeout-active` the same way. Then
      collect session-timeout right away: it checks the idle session after ever longer
      waits and keeps the active one busy, and runs up to about 4 hours in the background.
      The output gives the idle timeout as a range ("between 10 min and 15 min"), the
      absolute timeout, and flags LONG values or a server that accepts the cookie after
      its own expiry.
    load_note: Runs up to about 4 hours, mostly waiting; a few GET requests.
  - summary: Judge the session timeout
    evidence: [session-timeout, session-token-samples]
    ai_task: >-
      From steps 1 and 2 decide whether timeouts are enforced and reasonable. Verdict: fail
      when step 2 shows no idle timeout within the run ("none within ... [LONG]"), an idle
      or absolute timeout marked LONG for the application's sensitivity, or the server
      accepting the cookie after its own expiry; pass when the idle timeout is bounded
      server-side with an appropriate length (and the absolute one too, when measured);
      "-" when session-timeout is missing, failed, or INCONCLUSIVE. An absolute timeout
      "not measured" alone does not fail the test; mention it.
