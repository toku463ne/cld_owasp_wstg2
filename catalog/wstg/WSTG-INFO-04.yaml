id: WSTG-INFO-04
overview: >-
  Find every application served by the target's hosts: subdomains, virtual hosts on the
  same address, non-standard ports, and base paths, including forgotten staging,
  legacy, or administrative instances.
pass: >-
  Every application reachable on the target's hosts, ports, and virtual hosts is known to
  the system owner and is in scope or explicitly out of scope. A passive OSINT source that
  was unreachable (a CT log or web archive that returned 5xx or an error page) is recorded
  and recollected; on its own it is noted, not a pass or a fail. For an FQDN target the
  verdict rests on the server's own open ports and virtual hosts (steps 4 to 6) and the
  external scan (step 7); the subdomain list belongs to the parent domain.
fail: >-
  An unexpected application (old or staging environment, another department's tool,
  administrative console) is reachable on the target's hosts, ports, or virtual hosts.
notes:
  - Out-of-scope findings are reported as existence only; do not test them.
  - "Domain targets: only passive sources (CT logs, passive DNS, archives). FQDN targets: ports and virtual hosts of the server itself."
  - If every port shows filtered or no response, the scan did not reach the target; do not judge from it.
  - nmap and ffuf ignore http_proxy/https_proxy. Behind a proxy, use the curl loop in step 4 for web ports, and add -x to ffuf.
  - crt.sh and the Wayback Machine often return HTTP 502/503. A step that prints "... UNAVAILABLE" means the source was down, not that there is nothing there; mark that step '-' or 'no need', recollect it later, and judge the test from the sources that did run.
finding_kinds: [non-public-service-exposed, internal-component-exposed]
steps:
  - summary: "Domain: list subdomains from Certificate Transparency and passive sources"
    auto_run: true
    evidence: [ct-crtsh, subdomains-subfinder, dns-records]
    command: >-
      grep -q '^\[' {ev:ct-crtsh}/crtsh.json || echo "ct-crtsh UNAVAILABLE: crt.sh returned no JSON (HTTP 502/503 is common); using subfinder only this run - recollect crt.sh, do not read this as 'no subdomains'";
      { grep -q '^\[' {ev:ct-crtsh}/crtsh.json && jq -r '.[].name_value' {ev:ct-crtsh}/crtsh.json; cat {ev:subdomains-subfinder}/subfinder.txt; }
      | tr 'A-Z' 'a-z' | sed 's/^\*\.//' | sort -u | tee hosts-all.txt
  - summary: "Domain: resolve each name and group the names by address"
    command: >-
      while read -r h; do for a in $(dig +short A "$h" | grep -E '^[0-9.]+$'); do echo "$a $h"; done; done
      < hosts-all.txt | sort | tee hosts-by-ip.txt
  - summary: "Domain: find hosts and paths only the web archive still knows"
    auto_run: true
    evidence: [wayback-urls]
    command: >-
      grep -qi '^[[:space:]]*<' {ev:wayback-urls}/wayback.txt && echo "wayback-urls UNAVAILABLE: the Wayback Machine returned an error page, not a URL list (HTTP 503 is common); recollect";
      grep -qiE '^https?://' {ev:wayback-urls}/wayback.txt && sed -E 's#^[a-z]+://([^/:]+).*#\1#' {ev:wayback-urls}/wayback.txt | sort | uniq -c | sort -rn | head -50
  - summary: "FQDN: find open web and administrative ports on the server"
    evidence: [ports-web-common, dns-fqdn]
    command: >-
      grep open {ev:ports-web-common}/nmap-web.txt;
      for p in 80 81 443 3000 5000 8000 8080 8081 8443 8888 9000 9090 9443 10000; do for s in http https; do
      echo "$p $s $(curl -sk -m 5 -o /dev/null -w '%{http_code}' "$s://{fqdn}:$p/")"; done; done | grep -v ' 000$'
    load_note: The curl loop is the proxy-friendly alternative to nmap (28 requests). Admin ports such as 2375 (Docker) and 9200 (Elasticsearch) may trigger IDS alerts.
  - summary: "FQDN: find virtual hosts on the same server by Host header brute force"
    auto_run: true
    evidence: [vhost-ffuf]
    command: jq -r '.results[] | [.status, .length, .host] | @tsv' {ev:vhost-ffuf}/ffuf-vhost.json
  - summary: Identify the purpose of each host and port found
    command: >-
      while read -r hp; do echo "== $hp"; curl -sk -m 8 -D - -o body.tmp "https://$hp/" | grep -iE '^(HTTP/|server:|x-powered-by:|www-authenticate:)';
      grep -oiE '<title>[^<]*' body.tmp | head -1; done < hosts.txt
    operation: >-
      Put the hosts and host:port pairs from the steps above in hosts.txt, one per line, and
      run the command. Use titles, Server headers, realms, and names such as dev, stg, test,
      old, admin, jenkins, grafana, or phpmyadmin to decide the purpose of each, and record
      them in the inventory.
    evidence: [app-inventory, ports-web-common, vhost-ffuf, whatweb]
    ai_task: >-
      Draft the inventory from the evidence of all steps: one row per host or host:port with
      the likely purpose (production site, staging, admin console, API, mail, monitoring...),
      the evidence for it (title, Server header, realm, name), and whether it should be
      reachable from the Internet. Mark rows that need confirmation. Fail when a staging,
      test, or administrative host or port is open to the Internet; pass when every host
      found has a public purpose.
  - summary: Scan all ports from outside the target's network
    operation: >-
      From a host on the Internet, run `nmap -sV -Pn -p- --open -oN nmap-allports.txt {fqdn}`
      and upload the result with the source IP and times.
    evidence: [nmap-external-allports]
    load_note: Full port scan; agree on the time window and announce the source IP first.
