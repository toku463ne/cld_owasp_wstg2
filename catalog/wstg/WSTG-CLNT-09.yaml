id: WSTG-CLNT-09
overview: >-
  Check that pages, especially those with state-changing actions, cannot be framed by
  other sites, so a clickjacking overlay cannot lure a user into operating them.
pass: >-
  Sensitive pages set X-Frame-Options DENY/SAMEORIGIN or a CSP frame-ancestors directive.
fail: >-
  A sensitive page can be framed by any site and operated through an overlay (shown by a
  PoC).
notes:
  - The target is pages with state-changing actions; static pages have limited impact.
finding_kinds: [clickjacking]
steps:
  - summary: Check the framing-protection headers on the root response
    auto_run: true
    evidence: [http-root-https]
    command: >-
      grep -iE '^(x-frame-options|content-security-policy):' {ev:http-root-https}/stdout.txt
      | grep -iE 'x-frame-options|frame-ancestors' || echo "no X-Frame-Options or CSP frame-ancestors on the root response"
  - summary: Check framing protection on every page from the HAR
    auto_run: true
    evidence: [har-browse]
    command: wstg-har frame {ev:har-browse}/items/*.har
  - summary: Frame a FRAMEABLE state-changing page with a PoC (manual, to confirm)
    evidence: [clickjacking-tests]
    operation: >-
      Step 2 lists each HTML page from the HAR (including the authenticated ones the
      root-only check in step 1 cannot see) and marks it "framing denied" or "FRAMEABLE".
      For a state-changing page marked FRAMEABLE, build a PoC HTML page that frames it and
      check whether it displays and can be operated inside the frame. Save the PoC in
      clickjacking-tests; if no sensitive page is FRAMEABLE, mark it collected with a comment
      that step 2 found framing denied everywhere.
  - summary: Judge clickjacking
    evidence: [clickjacking-tests, http-root-https]
    ai_task: >-
      From steps 1 to 3 decide whether sensitive pages can be framed. Verdict: fail when a
      state-changing page can be framed and operated (no X-Frame-Options or frame-ancestors);
      pass when sensitive pages forbid framing; "-" when neither the HAR (step 2) nor
      clickjacking-tests shows any sensitive page.
