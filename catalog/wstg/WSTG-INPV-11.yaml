id: WSTG-INPV-11
overview: >-
  Check whether input is evaluated as server-side code (through eval, deserialization,
  templates, or file inclusion), which allows arbitrary execution.
pass: >-
  Input does not reach a code-evaluation path, or is strictly validated where it does.
fail: >-
  A fragment of input is evaluated as code, running arbitrary logic (including execution
  through local or remote file inclusion).
notes:
  - Confirm execution with a harmless command (sleep/ping-equivalent) or an out-of-band callback; keep proof minimal.
  - A successful case is RCE; report it at the highest priority.
finding_kinds: [code-injection, file-inclusion]
steps:
  - summary: Find inputs that may reach an evaluation or include path
    auto_run: true
    evidence: [katana-crawl]
    command: >-
      grep -oiE '[?&](eval|code|exec|func|callback|template|tpl|page|file|include|path|lang|module)=[^&"'"'"'<> ]*'
      {ev:katana-crawl}/katana.txt 2>/dev/null | sort -u | head -40 || echo "no obvious evaluation/include parameter in the crawl"
  - summary: Inject language-specific code (Tools button for in-band eval/time, manual for the rest)
    evidence: [code-injection-tests]
    operation: >-
      The in-band code-evaluation part is automated by agreement: Tools > Injection probe,
      pack "Code injection probe (eval / time)". For each parameter found in katana-crawl and
      har-browse it sends standard payloads that break out of a string/statement and either
      compute an arithmetic marker that prints back (`;print(7*191);//`, `'+str(7*191)+'` -
      SUSPECTED-eval when `1337` returns and the payload text does not, so a reflection is
      not a hit) or call a language-level sleep (`;sleep(5);//`, `__import__('time').sleep(5)`
      - SUSPECTED-time, confirmed twice). No command output is read and nothing is written.
      Results go to code-injection-tests. NOT automated (do by hand, record in the same
      evidence): deserialization gadgets and out-of-band confirmation (a DNS/HTTP callback) -
      these need language-specific chains or a listener. File inclusion (LFI/RFI, PHP
      wrappers, log/session poisoning) is already probed by WSTG-ATHZ-01 step 2 (Tools >
      File traversal); cite that evidence here. The judge (step 3) decides.
    load_note: The probe sends active code-evaluation payloads (a WAF may flag them); agree the test window with the owner before running it.
  - summary: Judge code injection
    evidence: [code-injection-tests]
    ai_task: >-
      From step 2 decide whether input is executed as code. Verdict: fail when a payload ran
      (confirmed by output, timing, or callback), including execution via file inclusion;
      pass when input never reaches evaluation or is strictly validated; "-" when
      code-injection-tests is missing. Report as RCE where execution was proved.
