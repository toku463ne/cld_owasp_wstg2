id: WSTG-CLNT-13
overview: >-
  Check for cross-site script inclusion (XSSI): whether an authenticated endpoint that
  returns JavaScript or JSON can be loaded by an external page and its data read.
pass: >-
  Dynamic JS/JSON cannot be loaded as a script cross-site, or is protected by an
  unguessable token; nosniff and a correct Content-Type are set.
fail: >-
  A cookie-authenticated JS/JSON response can be included with a <script src> from another
  page and its data read.
notes:
  - Likely where a JSON response is a bare array literal or JSONP is supported.
finding_kinds: [cross-site-script-inclusion]
steps:
  - summary: Find JS/JSON endpoints and JSONP callbacks
    auto_run: true
    evidence: [katana-crawl]
    command: >-
      grep -oiE '/[^ "'"'"'<>]*\.(json|js)(\?[^ "'"'"'<>]*)?' {ev:katana-crawl}/katana.txt 2>/dev/null | sort -u | head;
      grep -oiE '[?&](callback|jsonp|cb)=[^&"'"'"'<> ]*' {ev:katana-crawl}/katana.txt 2>/dev/null | sort -u | head
  - summary: Classify the authenticated JS/JSON responses in the HAR for XSSI
    auto_run: true
    evidence: [har-browse]
    command: wstg-har xssi {ev:har-browse}/items/*.har
    operation: >-
      Reads the JS/JSON responses captured while logged in and decides exploitability from
      the HAR alone, per response: the Content-Type, whether X-Content-Type-Options: nosniff
      is set, the include shape (array literal or JSONP = includable; object literal or an
      anti-XSSI prefix = safer), and `cross-site-auth` — whether the request's auth cookies
      would ride a cross-site `<script src>`. A cross-site script include is a subresource
      request, so only a `SameSite=None` cookie is sent; Lax/Strict are not. Verdicts:
      `XSSI EXPLOITABLE` (includable, not protected, and an auth cookie is SameSite=None);
      `XSSI CANDIDATE` (same, but the auth cookie has no SameSite: legacy browsers only);
      otherwise it notes why it is safe. No response data is printed, only shapes and flags.
  - summary: Confirm the cross-site read with a PoC (manual, only if needed)
    evidence: [xssi-tests]
    operation: >-
      Only needed to prove an `XSSI EXPLOITABLE`/`CANDIDATE` from step 2, or a JSONP endpoint
      (step 2 already decides the SameSite/shape/nosniff facts). Build an external HTML page
      that includes it with `<script src="https://TARGET/ENDPOINT">` and, with the victim's
      cookies, read the data (define the JSONP callback; for a bare array only legacy
      browsers leak it). Confirm the data is readable and whether an unguessable anti-CSRF
      token in the request prevents it. Save the PoC and result in xssi-tests.
  - summary: Judge cross-site script inclusion
    evidence: [xssi-tests, har-browse]
    ai_task: >-
      Decide whether XSSI is possible, mainly from step 2 (step 3 confirms only when needed).
      Verdict: fail when an authenticated JS/JSON response is includable, is not protected by
      nosniff plus a correct type, and its auth cookie is SameSite=None (`XSSI EXPLOITABLE`),
      or a JSONP endpoint leaks data cross-site; pass when the response is not includable, is
      protected by nosniff and a correct type, or the auth cookie is SameSite=Lax/Strict so it
      is not sent on a cross-site script include; "-" when no JS/JSON response was captured.
      Treat a `CANDIDATE` (no SameSite, legacy-only) as a low-severity note unless the PoC in
      step 3 confirms it.
