id: WSTG-CRYP-03
overview: >-
  Check that credentials, session tokens, and personal data are never sent over an
  unencrypted channel: plain HTTP, mixed content on HTTPS pages, cookies without the
  Secure flag, sensitive data placed in URLs, or cleartext protocols.
pass: >-
  Plain HTTP redirects to HTTPS before any content is served; the HAR shows every request
  carrying credentials, tokens, or personal data going over HTTPS; HTTPS pages load no
  active HTTP sub-resources; every session or authentication cookie has Secure; no
  sensitive value appears in a URL, query string, or Referer; no cleartext service in
  scope handles sensitive data.
fail: >-
  Any credential, token, or personal data is sent over HTTP (including a form whose action
  is HTTP, or an HTTP API called from an HTTPS page); an HTTPS page loads an HTTP
  script/iframe; a session cookie lacks Secure; sensitive data appears in a URL or is
  leaked in Referer to a third party; or a cleartext protocol (FTP, Telnet, SMTP/POP3/IMAP
  without TLS) carries sensitive data.
notes:
  - This test relies on a HAR of the real flows. Without it only the unauthenticated root can be judged, which is not a pass for the whole site.
  - A login page served over HTTPS that submits to an HTTP action still sends the password in clear; check the form action, not just the page URL.
  - Where ATHN-01 overlaps, describe the difference by channel (this test is about the transport; ATHN-01 is about the credential handling).
finding_kinds: [cleartext-sensitive-data, mixed-content, cookie-without-secure, sensitive-data-in-url, no-https-redirect]
steps:
  - summary: Capture the main authenticated flows as a HAR
    evidence: [har-browse]
  - summary: Find requests to http:// (not https://) that carry credentials, tokens, or cookies
    auto_run: true
    evidence: [har-browse]
    command: wstg-har cleartext {ev:har-browse}/items/*.har
  - summary: Check that forms sending sensitive data post to an HTTPS action
    auto_run: true
    evidence: [http-root-https, har-browse]
    command: >-
      grep -oiE '<form[^>]+action="[^"]*"[^>]*>' {ev:http-root-https}/body.html | grep -i 'action="http:';
      jq -r '.log.entries[] | select(.request.postData.text? != null)
      | select(.request.postData.text | test("pass|pwd|token|card|ssn"; "i"))
      | [.request.url] | @tsv' {ev:har-browse}/items/*.har
  - summary: Check for mixed content (HTTP sub-resources requested from HTTPS pages)
    auto_run: true
    evidence: [har-browse]
    command: >-
      jq -r '.log.entries[] | select((.request.headers[]? | select(.name|ascii_downcase=="referer")
      | .value | startswith("https://"))) | select(.request.url | startswith("http://"))
      | .request.url' {ev:har-browse}/items/*.har | sort -u
  - summary: Check that session and authentication cookies have the Secure flag
    auto_run: true
    evidence: [http-root-https, har-browse]
    command: >-
      grep -i '^set-cookie' {ev:http-root-https}/stdout.txt | grep -vi 'secure';
      jq -r '.log.entries[].response.headers[]? | select(.name|ascii_downcase=="set-cookie")
      | .value' {ev:har-browse}/items/*.har | grep -vi 'secure'
  - summary: Check for sensitive values carried in URLs or query strings
    auto_run: true
    evidence: [har-browse]
    command: >-
      jq -r '.log.entries[] | .request.url' {ev:har-browse}/items/*.har
      | grep -iE '[?&](pass|pwd|token|sessionid|auth|card|ssn|email)=' | sort -u
  - summary: Check cleartext services in scope for sensitive data
    operation: >-
      For each non-TLS service port in the scope record (FTP, Telnet, plain SMTP/POP3/IMAP),
      confirm whether sensitive data passes through it, or that the service is absent.
      Write "no cleartext services in scope" as text when there are none.
