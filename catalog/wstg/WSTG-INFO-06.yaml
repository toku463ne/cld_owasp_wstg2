id: WSTG-INFO-06
overview: >-
  List every input the application accepts (URLs, query and body parameters, JSON and
  XML fields, headers, cookies, hidden fields, file uploads), anonymous and logged in,
  as the base for later tests.
pass: >-
  The entry point inventory was built from both the anonymous and the logged-in
  walkthrough, and no entry point meant for logged-in users answers without
  authentication. This test is mainly informational.
fail: >-
  While enumerating, an entry point that should require login (or a higher role)
  returns its content or performs its function without authentication.
notes:
  - Coverage is the goal. A crawl without login misses most of the application; the logged-in HAR is required.
  - A missing HAR or crawl is not a pass; the inventory is incomplete until both walkthroughs exist.
  - The tool replays GET only and never requests paths that look state-changing (logout, delete, ...).
finding_kinds: [unauthenticated-endpoint]
steps:
  - summary: Walk through the application in the browser, anonymous and logged in, and save HAR files
    operation: Follow the capture instructions of the HAR evidence; visit every menu, form, and wizard step once.
    evidence: [har-browse]
  - summary: List the requests and their parameters from the HAR files
    auto_run: true
    evidence: [har-browse]
    command: wstg-har entry-points --host {fqdn} {ev:har-browse}/items/*.har
    operation: >-
      One block per method and path seen in the browser (POST bodies included), with the
      parameter names by where they are sent. ID-like parts of a path are shown as <id>.
  - summary: Probe every entry point with and without login (collected automatically)
    auto_run: true
    evidence: [entry-points, entry-point-list, har-browse, katana-crawl, content-ffuf, default-content,
               admin-paths, metafiles, wayback-urls]
    input_list: entry-point-list
    collects: entry-points
    command: cat {ev:entry-points}/stdout.txt
    operation: >-
      Optional: type paths you know in the box (one per line, for example /login and
      /myaccount) and press "Save and collect". Paths found by the HAR, crawl, ffuf,
      robots/sitemap, and archive are added automatically. Lines marked OPEN answer the
      same without login although they were seen only logged in: check each one.
  - summary: Judge the entry point inventory
    evidence: [entry-points, har-browse]
    ai_task: >-
      From steps 2 and 3, summarise the entry points (method, path, parameters and where
      they are sent, forms, file uploads) and whether each needs login. Verdict: fail when
      an entry point that should need login answers with its content without cookies
      (step 3 "OPEN", confirmed by its content or purpose); pass when the logged-in HAR and
      the probe exist and no such entry point is found; "-" when the HAR or entry-points
      is missing, or no logged-in session was compared.
