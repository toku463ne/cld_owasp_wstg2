id: WSTG-CLNT-12
overview: >-
  Check that sensitive data (session tokens, personal data, secrets) is not kept in
  browser storage (localStorage, sessionStorage, IndexedDB), where XSS could read it.
pass: >-
  No credentials, tokens, or personal data are stored in browser storage.
fail: >-
  An access token or personal data is kept in localStorage in readable form and could be
  stolen via XSS.
notes:
  - Check whether storage is cleared on logout.
finding_kinds: [browser-storage-sensitive-data]
steps:
  - summary: Find browser-storage writes in the client scripts
    auto_run: true
    evidence: [site-assets]
    command: >-
      grep -rhnoiE '(localStorage|sessionStorage|indexedDB)\.[A-Za-z]+\([^)]*' {ev:site-assets}/site 2>/dev/null | sort -u | head -40
      || echo "no browser-storage usage in the collected scripts"
  - summary: Inventory localStorage from the captured storage state
    auto_run: true
    evidence: [har-browse]
    command: wstg-har storage {ev:har-browse}/items/*
  - summary: Inspect sessionStorage, IndexedDB, and logout clearing in the browser (manual)
    evidence: [browser-storage-tests]
    operation: >-
      Step 2 lists the localStorage keys the capture saved and flags any token/credential
      kept client-side, so that part is automated. sessionStorage and IndexedDB are not in
      the storage state, and clearing on logout is not observable from it. In DevTools
      Application, inspect sessionStorage and IndexedDB for session tokens, personal data, or
      secrets, check whether localStorage/sessionStorage survive logout, and whether a stored
      value is trusted on read. Record in browser-storage-tests, or mark it collected with a
      comment if step 2 already covered the stored data.
  - summary: Judge browser storage
    evidence: [browser-storage-tests]
    ai_task: >-
      From steps 2 and 3 decide whether sensitive data is in browser storage. Verdict: fail
      when a token, secret, or personal data is stored readably (stealable via XSS) or not
      cleared on logout; pass when no sensitive data is stored client-side; "-" when neither
      the storage state (step 2) nor browser-storage-tests shows any stored data.
