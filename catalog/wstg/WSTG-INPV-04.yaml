id: WSTG-INPV-04
overview: >-
  Check how the application and any front-end (WAF, load balancer) handle a repeated
  parameter. A difference in which value each uses (HTTP parameter pollution) can bypass
  validation or authorization.
pass: >-
  Duplicate parameters are rejected, or every component on the path uses the same value,
  so no component can be fed a different value.
fail: >-
  The front-end and the application pick different values from a duplicated parameter, so
  a validation or authorization check can be passed with one value while another is used.
notes:
  - The point is the discrepancy between the front-end and the back-end; record both responses side by side.
finding_kinds: [http-parameter-pollution]
steps:
  - summary: List parameters to try polluting
    auto_run: true
    evidence: [katana-crawl]
    command: >-
      grep -oE '[?&][A-Za-z0-9_.-]+=' {ev:katana-crawl}/katana.txt 2>/dev/null | tr -d '?&=' | sort | uniq -c | sort -rn | head -40
      || echo "no parameters seen in the crawl"
  - summary: Measure the precedence rule for a duplicated parameter (collected automatically)
    auto_run: true
    evidence: [hpp-check, katana-crawl, har-browse]
    command: cat {ev:hpp-check}/stdout.txt
    operation: >-
      Automated: hpp-check sends each GET parameter twice with two harmless markers (no
      attack payload) and reports whether the application uses the first value, the last
      value, or both. Collect it after katana-crawl (and har-browse for parameters behind
      login).
  - summary: Compare the front-end and the back-end (manual, optional)
    evidence: [hpp-tests]
    operation: >-
      Optional, for a parameter where hpp-check shows a value is used: check whether a front
      proxy or WAF reads a different copy than the application (place the duplicate across
      the query and the body, try array notation `id[]`, and compare the proxy and
      application responses side by side). Record in hpp-tests. This front-end vs back-end
      discrepancy is what makes pollution exploitable and cannot be seen from one response.
  - summary: Judge HTTP parameter pollution
    evidence: [hpp-check, hpp-tests]
    ai_task: >-
      From steps 1 and 2 decide whether a pollution discrepancy is exploitable. Verdict:
      fail when the front-end and application use different values from a duplicated
      parameter so a check can be bypassed or a different value injected; pass when
      duplicates are rejected or every component uses the same value; "-" when only the
      automatic precedence rule (hpp-check) is available and no front-end/back-end
      comparison was done - report the measured rule and say the discrepancy was not
      checked.
