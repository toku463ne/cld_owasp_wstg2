id: WSTG-SESS-04
overview: >-
  Check that the session identifier is not exposed where it can leak: in URLs, browser
  history, server logs, a Referer sent to third parties, local or session storage, or
  error pages.
pass: >-
  The session token is carried only in a cookie and never appears in a URL, a redirect
  target, local/session storage, a Referer to an external resource, or an error page.
fail: >-
  The token appears in a URL query or redirect, is stored in local/session storage, leaks
  to an external site through the Referer, or is echoed in an error page or stack trace.
notes:
  - Even over TLS, a token in a URL remains in browser history and proxy logs; note that in the finding.
  - Check Referer behaviour on pages that load external resources (CDN, analytics).
finding_kinds: [session-token-exposed]
steps:
  - summary: Check for the session token in URLs and client storage
    auto_run: true
    evidence: [katana-crawl, site-assets]
    command: >-
      grep -oiE '[?&](sid|sessionid|session_id|phpsessid|jsessionid|aspsessionid|token|auth|access_token|jwt|cfid|cftoken)=[^&"'"'"'<> ]*'
      {ev:katana-crawl}/katana.txt 2>/dev/null | sed -E 's/=.*/=<value>/' | sort -u | head;
      grep -rhoiE '(localStorage|sessionStorage)\.(setItem|getItem)\([^)]*' {ev:site-assets}/site 2>/dev/null | sort -u | head
  - summary: Check the HAR for the session token carried in a request URL
    auto_run: true
    evidence: [har-browse]
    command: wstg-har urls {ev:har-browse}/items/*.har
  - summary: Check that error pages do not echo the session token
    auto_run: true
    evidence: [http-404]
    command: >-
      grep -ioE '(session|token|phpsessid|jsessionid|aspsessionid|csrf|auth)[^<>"'"'"' ]{0,40}'
      {ev:http-404}/body.html 2>/dev/null | sort -u | head || echo "no session-like string in the 404 body"
  - summary: Judge the Referer, storage, and error bodies from the HAR
    auto_run: true
    evidence: [har-browse]
    command: wstg-har expose {ev:har-browse}/items/*
  - summary: Trigger malformed-input errors with the session and check the responses
    auto_run: true
    evidence: [session-error-probes]
    command: cat {ev:session-error-probes}/stdout.txt
    operation: >-
      Automated: session-error-probes replays the logged-in HAR requests with malformed
      input (array instead of scalar, missing parameters, oversized value, invalid
      encoding, broken JSON) and flags "ERROR-ECHO" (the token in the error response) and
      "DEBUG-OUTPUT" (stack trace, SQL error, server variables). Collect it after the HAR.
      When a flow is missing from the output (it was not in the capture, or the run says
      the session expired), capture it again with `uv run wstg capture {fqdn} --role user`
      and collect session-error-probes again.
  - summary: Judge session token exposure
    evidence: [katana-crawl, http-404, har-browse, session-error-probes]
    ai_task: >-
      From the outputs of steps 1 to 5 decide whether the token is exposed outside a
      cookie. Verdict: fail when step 1 or 2 shows a session token in a URL
      (TOKEN-IN-URL), step 3 or 5 shows it echoed in an error page (ERROR-ECHO), or step 4
      shows REFERER-LEAK, STORAGE-TOKEN, or ERROR-ECHO; pass when the HAR (steps 2 and 4)
      and session-error-probes (step 5) were collected and none of them shows an
      exposure; "-" when the HAR or session-error-probes is missing or failed. A
      DEBUG-OUTPUT line without the token is an error-handling issue for WSTG-ERRH-01/02,
      not a token exposure.
