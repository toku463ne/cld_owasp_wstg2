id: WSTG-INPV-16
overview: >-
  Check how the server and any front-end handle raw and malformed incoming requests
  (unusual methods, duplicate or malformed headers, oversized headers, an invalid Host),
  to find where a front-end restriction can be passed or the parser misbehaves.
pass: >-
  Internal and management requests are reliably blocked at the front-end, and malformed
  requests are rejected cleanly.
fail: >-
  A path-normalisation difference or a crafted header lets a request pass the front-end
  restriction and reach internal functions, or the parser produces an abnormal response.
notes:
  - This needs the front-end configuration from the owner to avoid false judgements; check against it.
  - Raise header sizes gradually; malformed or oversized requests can destabilise the parser.
finding_kinds: [request-parsing-weakness, unprotected-path]
steps:
  - summary: Get the front-end configuration and internal paths to test (manual)
    evidence: [frontend-config, firewall-rules, raw-request-tests]
    operation: >-
      From the owner, get the front-end (reverse proxy, WAF, LB) configuration: which paths
      and methods are meant to be blocked, and which are internal-only. List the requests to
      try (internal paths, blocked methods) in raw-request-tests, noting the expected block.
      Save the owner's answer as frontend-config.
  - summary: Send raw and malformed requests and observe handling (Tools button; judge against the config)
    evidence: [raw-request-tests]
    operation: >-
      Automated by agreement: Tools > Raw request probe (`wstg-raw`). For each path the front
      end should block - the ones you type from step 1's frontend-config, plus paths from
      katana-crawl - it sends the canonical request and, when that is blocked (401/403/404),
      a battery of path-normalisation variants (case, trailing dot/slash, dot segments, an
      encoded separator like `%2f`, a semicolon parameter such as `/app/..;/admin`); a variant
      that is NOT blocked is reported SUSPECTED-bypass (the front and back end normalised the
      path apart). It also sends a parser battery to `/` over a raw socket (a duplicate Host,
      a duplicate Content-Length, bare-LF line endings, an unrelated Host, an unknown method)
      and reports SUSPECTED-parser when a smuggling/routing precondition is accepted (answered
      2xx/3xx). The oversized-header step (a header raised gradually to a cap) is opt-in because
      it can destabilise the parser. Results go to raw-request-tests. Still by hand where the
      probe cannot reach: request smuggling confirmation with a real body (CL/TE desync), and
      anything that needs the exact front-end product behaviour. The judge (step 3) confirms
      each lead against frontend-config - a variant the front end still blocks is a pass.
    load_note: Sends raw/malformed requests a WAF may flag; the opt-in oversized-header step consumes parser resources and can destabilise the server. Agree the test window with the owner.
  - summary: Judge raw request handling
    evidence: [raw-request-tests]
    ai_task: >-
      From steps 1 and 2 decide whether the front-end restrictions hold. Verdict: fail when
      a crafted or normalised request passed a front-end restriction to reach an internal
      function, or the parser gave an abnormal response that could be abused; pass when all
      such requests were blocked or rejected cleanly; "-" when raw-request-tests is missing.
