id: WSTG-SESS-08
overview: >-
  Check for session puzzling: whether the same session variable is set and read across
  different flows (login, password reset, registration) so that a state created by one
  flow is mistaken for another, granting access or identity it should not.
pass: >-
  Each flow keeps its own state; an intermediate state of one flow (for example a
  reset-in-progress state) is never treated as another (for example authenticated).
fail: >-
  A session variable set part-way through one flow is reused by another so that an
  intermediate state grants access, confirms identity, or skips a check it should not.
notes:
  - Judged from the main capture (har-browse) without sending a request; walk the account flows the application has (login with a second factor, password change, password reset request, registration) once during the capture, with the tester's own test accounts.
  - A flow not walked in the capture cannot be judged; say so.
finding_kinds: [session-puzzling]
steps:
  - summary: List the account flows in the capture and the cookies each step sets
    auto_run: true
    evidence: [har-browse]
    command: wstg-har flows {ev:har-browse}/items/*
    operation: >-
      Automated from the capture (`uv run wstg capture {fqdn} --role user`); no request is
      sent. During the capture, walk once each account flow the application has: login
      (with a second factor if any), password change, password reset request, and
      registration. The output shows, per flow step, the method, path, status, redirect,
      body field names, the cookie names sent, which cookies the response set, changed, or
      cleared, and the next pages opened. Values are never shown.
  - summary: Judge session puzzling
    evidence: [har-browse]
    ai_task: >-
      From step 1 decide whether a session state set part-way through one flow is reused
      by another. Signs: a cookie set at an unfinished step (for example a reset or
      verification step) that later pages accept as logged in, a "next page" that needs a
      completed flow opened with 200 right after an unfinished step, or the same cookie
      carrying both a reset/registration state and the login state without being
      reissued. Verdict: fail when the capture shows such reuse; pass when each flow step
      that grants access comes after its flow completed and the session cookie is reissued
      at login; "-" when the capture holds no multi-step flow or not enough to decide. Say
      that it was judged from the capture only.
