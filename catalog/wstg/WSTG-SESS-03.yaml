id: WSTG-SESS-03
overview: >-
  Check for session fixation: whether the session identifier issued before login is still
  valid after login, which would let an attacker fix a victim's session to a known
  identifier and then take it over.
pass: >-
  The session identifier is reissued on successful authentication and the pre-login
  identifier is rejected afterwards; an identifier cannot be injected through a URL or
  parameter.
fail: >-
  The same identifier is valid before and after login (not reissued), or an
  attacker-supplied identifier survives login so the session can be hijacked.
notes:
  - Check reissue on privilege change too, not only at login.
  - Use the tester's own test account; record the pre-login and post-login identifiers inside evidence only.
finding_kinds: [session-fixation]
steps:
  - summary: Compare the session identifier before and after login (from the login HAR)
    evidence: [session-reissue, har-browse]
    operation: >-
      No separate capture is needed: this reads the `har-browse` login capture (record it
      with `uv run wstg capture {fqdn} --role user`, starting logged out and logging in
      during the walk, so the HAR spans the login). wstg-sess then reads the session
      identifier before and after login and flags it NOT REISSUED, replays the pre-login
      cookie against an authenticated URL to check whether the old identifier is still
      accepted, and flags a session id carried in a URL. Collect it after the HAR.
  - summary: Confirm reissue on a privilege change (manual, only if needed)
    evidence: [session-reissue-tests]
    operation: >-
      The automatic check (step 1) covers login. If the application raises privilege after
      login (an admin "sudo" step or a step-up authentication), repeat the check across that
      boundary by hand: read the session cookie before and after the privilege change and see
      whether it is reissued. Add the result to session-reissue-tests, or mark it collected
      with a comment when there is no privilege-change step.
  - summary: Judge session fixation
    evidence: [session-reissue, session-reissue-tests]
    ai_task: >-
      From the session-reissue output (step 1) and session-reissue-tests (step 2) decide
      whether the session is fixable. Verdict: fail when the identifier is not reissued at
      login (a `[FAIL]` "NOT REISSUED" line), the pre-login identifier is still accepted, or a
      session id is carried in a URL; pass when the identifier is reissued at login and the
      old one is rejected; "-" when session-reissue is missing.
