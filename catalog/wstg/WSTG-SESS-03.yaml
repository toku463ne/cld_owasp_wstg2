id: WSTG-SESS-03
overview: >-
  Check for session fixation: whether the session identifier issued before login is still
  valid after login, which would let an attacker fix a victim's session to a known
  identifier and then take it over.
pass: >-
  The session identifier is reissued on successful authentication and the pre-login
  identifier is rejected afterwards; an identifier cannot be injected through a URL or
  parameter.
fail: >-
  The same identifier is valid before and after login (not reissued), or an
  attacker-supplied identifier survives login so the session can be hijacked.
notes:
  - Check reissue on privilege change too, not only at login.
  - Use the tester's own test account; record the pre-login and post-login identifiers inside evidence only.
finding_kinds: [session-fixation]
steps:
  - summary: Capture a login and compare the session identifier (reissue, injection, replay)
    evidence: [session-reissue-tests]
    operation: >-
      On the Kali host, from the project directory, run `uv run wstg capture-fixation {fqdn}`
      and log in with a TEST account in the browser window that opens. The tool reads the
      session cookie before login, injects a chosen value to test fixation, waits for your
      manual login, reads the cookie again, replays the pre-login cookie against the page you
      ended on to see whether it is still accepted, and checks for a session id in the URLs;
      it saves a masked summary to session-reissue-tests. It flags: the identifier NOT
      reissued at login, an injected value that survived login, the pre-login identifier
      still accepted, and a session id carried in a URL.
  - summary: Confirm reissue on a privilege change (manual, only if needed)
    evidence: [session-reissue-tests]
    operation: >-
      The capture (step 1) covers login. If the application raises privilege after login
      (for example an admin "sudo" step or a step-up authentication), repeat the check
      across that boundary by hand: read the session cookie before and after the privilege
      change and see whether it is reissued. Add the result to session-reissue-tests, or mark
      it collected with a comment when there is no privilege-change step.
  - summary: Judge session fixation
    evidence: [session-reissue-tests]
    ai_task: >-
      From the session-reissue-tests summary decide whether the session is fixable. Verdict:
      fail when the identifier is not reissued at login (a `[FAIL]` "NOT REISSUED" line), an
      injected identifier survived login, the pre-login identifier is still accepted, or a
      session id is carried in a URL; pass when the identifier is reissued at login and the
      old one is rejected; "-" when session-reissue-tests is missing.
