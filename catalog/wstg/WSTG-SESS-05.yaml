id: WSTG-SESS-05
overview: >-
  Check that state-changing requests are protected against cross-site request forgery:
  by an unpredictable per-request or per-session token that the server verifies, and/or
  by SameSite cookies with an Origin or Referer check.
pass: >-
  Every state-changing request seen in the logged-in capture is protected: it carries an
  anti-CSRF token, cannot be sent cross-site without a CORS preflight (JSON body, custom
  header, or PUT/PATCH/DELETE) that CORS does not allow, or its session cookie is
  SameSite=Lax/Strict; GET does not change state.
fail: >-
  A state-changing request carries no token, can be sent by a cross-site HTML form (simple
  method and content type, no custom header), and its session cookie is SameSite=None or
  has no SameSite; or a state change happens on GET with cookies a cross-site navigation
  sends; or CORS allows a credentialed cross-site call to it.
notes:
  - The test asks whether CSRF is likely; it is judged from the capture without sending a forged request. A token that is sent is not proof that the server verifies it; say so in the finding.
  - Browse every state-changing function once in the logged-in capture (settings, forms, delete), or it cannot be judged.
finding_kinds: [csrf]
steps:
  - summary: Check whether forms carry an anti-CSRF token
    auto_run: true
    evidence: [katana-crawl, auth-pages]
    command: >-
      grep -rhoiE 'name=["'"'"']?(csrf|xsrf|_token|authenticity_token|__requestverificationtoken|anticsrf|_csrf)[^ "'"'"'>]*'
      {ev:katana-crawl}/responses {ev:auth-pages}/pages 2>/dev/null | sort | uniq -c | sort -rn | head
      || echo "no anti-CSRF token field seen in the collected forms (confirm per request)"
  - summary: Judge the CSRF posture of each state-changing request from the HAR
    auto_run: true
    evidence: [har-browse]
    command: wstg-har csrf {ev:har-browse}/items/*
    operation: >-
      Automated from the logged-in capture (`uv run wstg capture {fqdn} --role user`); no
      request is sent. Per state-changing request: anti-CSRF token, whether a cross-site
      form could send it without a CORS preflight, the SameSite of its session cookies,
      Origin, and CORS. CSRF-LIKELY is a finding candidate; TOKEN, PREFLIGHT, and MITIGATED
      are protected as far as the capture shows; NOT-APPLICABLE uses no cookie auth. If a
      state-changing function is missing from the list, walk it in a new capture.
  - summary: Judge CSRF protection
    evidence: [har-browse, katana-crawl, auth-pages]
    ai_task: >-
      From step 2 (and the form tokens of step 1) decide whether CSRF is likely. Verdict:
      fail when any request is CSRF-LIKELY (no token, sendable by a cross-site form,
      session cookie SameSite=None or unset, a state change on GET, or CORS allowing a
      credentialed cross-site call); pass when every state-changing request is TOKEN,
      PREFLIGHT, MITIGATED, or NOT-APPLICABLE; "-" when the HAR is missing or step 2 lists
      no state-changing request. Report one finding per CSRF-LIKELY request and note that
      it was judged from the capture, without a forged request.
