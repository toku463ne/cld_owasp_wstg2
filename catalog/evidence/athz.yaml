# Evidence used by the Authorization (ATHZ) scenarios.
# Schema: see the comments at the top of core.yaml.
# Authorization testing replays requests with the sessions of different roles and
# sends payloads (traversal, object references) to the target, and so touches other
# test users' data. It cannot be driven blindly by the tool, so these are manual and
# use dedicated test accounts and test data only. The role matrix (WSTG-IDNT-01) and
# the per-role HAR files (har-browse) are the inputs.
evidence:

  - id: traversal-param-list
    title: Traversal candidate URLs typed by the tester
    target_type: fqdn
    kind: manual
    description: >-
      URLs with a file-naming parameter the tester wants probed, one per line (for example
      {base_url}/page?file=home). Typed in the box of WSTG-ATHZ-01 step 2, which saves this
      and collects traversal-probe.

  - id: traversal-probe
    title: Directory traversal and file inclusion probe
    target_type: fqdn
    kind: auto
    level: full
    heavy: true
    inputs: [traversal-param-list, katana-crawl, har-browse]
    description: >-
      One block per file-naming parameter (from traversal-param-list, the crawl, and the
      HAR): the baseline response, then a fixed set of traversal and inclusion payloads
      (../ and ..\ sequences, %2e%2e%2f and double-encoded variants, ....//, an absolute
      path, a null byte, a trailing dot, a php://filter wrapper, and a data:// wrapper that
      evaluates a benign expression to tell a file that RUNS from one merely displayed). For each: status,
      size, and - when a well-known file signature appears (/etc/passwd, win.ini, a
      base64-encoded source) or the answer changed a lot from the baseline - a short body
      excerpt, flagged TRAVERSAL. When the HAR holds a logged-in session its cookies are
      used. GET only, no redirects, only the target host contacted; WSTG_PAUSE applies.
    argv: [wstg-trav, --base, "{base_url}/", --list, "{ev:traversal-param-list}",
           --katana, "{ev:katana-crawl}", --har, "{ev:har-browse}", "{pause_args}"]
    pause_args: [--pause, "{pause}"]
    timeout: 3600
    load_note: Sends about ten traversal payloads per file-naming parameter; can trip a WAF and fill error logs. Collect it with the owner's agreement; WSTG_PAUSE slows it down.

  - id: traversal-tests
    title: Remote/log file-inclusion tests (manual)
    target_type: fqdn
    kind: manual
    description: >-
      WSTG-ATHZ-01 step 3, only the parts the probe cannot do: remote file inclusion from a
      host you control, and log/session poisoning. One text item per parameter: the payload,
      the host or file used, and whether code ran. Local read-traversal and data:// code
      execution are in traversal-probe.

  - id: authz-bypass-tests
    title: Authorization-schema bypass tests
    target_type: fqdn
    kind: manual
    description: >-
      One text item per request from the role matrix (WSTG-IDNT-01) replayed with a lower
      role's session and with no session: the request (method and path), the session used,
      and the response status and whether the action succeeded. Include high-privilege
      endpoints found only in the HTML, JavaScript, or API definitions (hidden in the UI)
      replayed with a low-privilege session. A 200 that performs the action is a bypass; a
      hidden menu item alone is not.

  - id: privilege-escalation-tests
    title: Privilege escalation tests
    target_type: fqdn
    kind: manual
    description: >-
      One text item per escalation attempt, grouped as horizontal (another user of the
      same role) and vertical (a higher role): the value changed (a role or group
      parameter, a cookie, a JWT claim such as role or isAdmin), the request replayed with
      a low-privilege session, and whether the higher-privilege function or another user's
      resource was reached. Use dedicated test accounts and test data only.

  - id: idor-tests
    title: Insecure direct object reference tests
    target_type: fqdn
    kind: manual
    description: >-
      One text item per object-reference parameter tested (for example id, order id, a
      file name, a numeric or UUID path segment): the reference changed to another test
      user's value, the method used (GET, POST, JSON body, multipart), and whether the
      other user's data could be read, updated, or deleted. Test between dedicated test
      accounts only, never real data; keep retrieved data to a summary.
