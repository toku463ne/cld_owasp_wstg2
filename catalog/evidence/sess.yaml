# Evidence used by the Session Management (SESS) scenarios.
# Schema: see the comments at the top of core.yaml.
# Anonymous session cookies and their attributes come from session-token-samples
# (catalog/evidence/cryp.yaml). Authenticated session behaviour (reissue at login,
# logout, timeout, hijacking) needs a logged-in session, so it is captured by hand
# with a test account; the per-role HAR (har-browse) holds the login responses.
evidence:

  - id: cookie-attr-tests
    title: Authenticated session cookie attributes
    target_type: fqdn
    kind: manual
    description: >-
      The Set-Cookie response headers of the login (from the HAR, or
      `curl -si -c cookies.txt --data '<login body>' {base_url}/<login>`), so each
      authenticated session cookie's Secure, HttpOnly, SameSite, Domain, and Path can be
      judged. Mark session and authentication cookies apart from CSRF or tracking cookies.
      The headers hold the session value, so they stay inside evidence, never in a finding.

  - id: session-reissue
    title: Session identifier reissue (fixation) check
    target_type: fqdn
    kind: auto
    level: full
    after_capture: login
    inputs: [har-browse]
    description: >-
      Read from the login HAR (har-browse) by wstg-sess: the session identifier before and
      after login and whether it is reissued, whether a session id is carried in a URL, and -
      best effort - a replay of the pre-login cookie against an authenticated URL to check
      whether the old identifier is still accepted. No extra capture is needed; it reuses the
      logged-in capture. It finds the login from a password field in the request body
      (localised names too); when it cannot, it compares the first and last value of each
      session cookie and marks the result inconclusive. Identifier values are masked, so the
      raw values stay in the HAR only.
    argv: [wstg-sess, --base, "{base_url}/", --har, "{ev:har-browse}", "{pause_args}"]
    pause_args: [--pause, "{pause}"]
    est: 30
    timeout: 300
    load_note: One replay request to the target; reads the login HAR. Needs a har-browse capture that includes the login step.

  - id: session-reissue-tests
    title: Session fixation notes (privilege change)
    target_type: fqdn
    kind: manual
    description: >-
      Anything the automatic check (session-reissue) could not do: reissue on a privilege
      change (an admin step-up or sudo), and an active id-injection test if needed. One text
      item per check: what was tried and whether the identifier was reissued or accepted.
      When there is no privilege-change step, mark this evidence collected with a comment.
      The raw identifier values stay inside evidence only.

  - id: session-error-probes
    title: Malformed-input error probes with the session
    target_type: fqdn
    kind: auto
    level: full
    after_capture: login
    inputs: [har-browse]
    description: >-
      wstg-sess --errors replays the requests of the logged-in HAR (har-browse) with
      malformed input and the captured session cookie: a query parameter sent as an array
      (invalid type), all parameters dropped (missing id), an oversized value, an invalid
      percent-encoding, a broken JSON body for JSON requests, and one missing path. Each
      error response is checked for the session or bearer token echoed back (ERROR-ECHO)
      and for stack traces or debug output (DEBUG-OUTPUT: Python, Java, .NET, PHP, Node,
      Rails, SQL errors, server variables). Token values are masked; the raw values stay
      in the HAR only. Login and state-changing requests (logout, delete, ...) are skipped.
    argv: [wstg-sess, --errors, --base, "{base_url}/", --har, "{ev:har-browse}", "{pause_args}"]
    pause_args: [--pause, "{pause}"]
    est: 60
    timeout: 600
    load_note: >-
      Up to about 80 requests with malformed input (4 per GET template, 1 per JSON request,
      20 templates per role); a WAF may flag them. Needs a logged-in har-browse capture
      whose session is still valid.

  - id: har-logout
    title: Browser HAR of a login and logout
    target_type: fqdn
    kind: manual
    description: >-
      One short capture for the logout check (WSTG-SESS-06), kept apart from the main walk
      in har-browse so that session stays usable. On the tool's host, from the project
      directory, run `uv run wstg capture {fqdn} --role logout`; in the browser that opens,
      log in, open one page only a logged-in user sees, log out, and press Enter in the
      terminal. The HAR and storage state are stored here automatically; then collect
      logout-replay. Fallback without the capture tool: save the same walk as a HAR from the
      browser developer tools and upload it here. It holds cookies; keep it only here.

  - id: har-timeout
    title: Browser HARs for the session timeout
    target_type: fqdn
    kind: manual
    description: >-
      Captures for the timeout check (WSTG-SESS-07), kept apart from the main walk in
      har-browse so no other check resets their idle timer. On the tool's host, from the
      project directory, run `uv run wstg capture {fqdn} --role timeout`: log in, open one
      page only a logged-in user sees, and press Enter without logging out. Optionally, for
      the absolute timeout, do the same with `--role timeout-active`. Then collect
      session-timeout right away. They hold cookies; keep them only here.

  - id: logout-replay
    title: Logout invalidation check
    target_type: fqdn
    kind: auto
    level: light
    after_capture: logout
    inputs: [har-logout]
    description: >-
      Before collecting (by hand, stored in the manual evidence har-logout): run
      `uv run wstg capture {fqdn} --role logout` on the tool's host, log in, open one page
      only a logged-in user sees, log out, and press Enter. What this automatic collection
      does: it finds the logout in that capture, the session cookie in use just before it,
      whether the logout response clears the cookie in the browser and whether the browser
      still held it at the end of the capture; then it replays the pre-logout cookie
      against up to three authenticated pages seen before the logout, each compared with
      the same page fetched without a cookie, and reports "still accepted" [FAIL] or
      "rejected" [GOOD]. Cookie values are masked.
    argv: [wstg-sess, --logout, --base, "{base_url}/", --har, "{ev:har-logout}", "{pause_args}"]
    pause_args: [--pause, "{pause}"]
    est: 20
    timeout: 300
    load_note: At most six GET requests (each page with the old cookie and without one). Needs the logout capture in har-logout.

  - id: session-timeout
    title: Session idle and absolute timeout measurement
    target_type: fqdn
    kind: auto
    level: full
    heavy: true
    after_capture: timeout
    inputs: [har-timeout]
    description: >-
      Before collecting (by hand, stored in the manual evidence har-timeout): run
      `uv run wstg capture {fqdn} --role timeout` on the tool's host, log in, open one page
      only a logged-in user sees, and press Enter without logging out. Optionally do the
      same with `--role timeout-active` for the absolute timeout. Then collect this right
      away. What this automatic collection does: it checks the `timeout` session right
      away and then after ever longer idle waits (5, 10, 15, 20, 30, 45, 60 minutes; every
      request resets the idle timer), so the first rejection bounds the idle timeout; it
      keeps the `timeout-active` session busy with one request every 5 minutes until the
      server rejects it or the run ends (4 hours). Each check is one GET of an
      authenticated page from the capture, compared with the same page without a cookie.
      It also flags a server that still accepts the cookie after the cookie's own expiry.
      Cookie values are masked.
    argv: [wstg-sess, --timeout, --base, "{base_url}/", --har, "{ev:har-timeout}", "{pause_args}"]
    pause_args: [--pause, "{pause}"]
    est: 14400
    timeout: 18000
    load_note: >-
      Runs up to about 4 hours, mostly waiting: about 16 GET requests for the idle
      measurement and two every 5 minutes for the absolute one. Needs the `timeout` capture
      (and optionally `timeout-active`) in har-timeout, collected right after capturing.
      Other automatic checks never use these two sessions.

  - id: hijacking-tests
    title: Session hijacking (token portability) tests
    target_type: fqdn
    kind: manual
    description: >-
      Optional (WSTG-SESS-09 step 4): with the tester's own test account only, whether the
      session works in a second browser (and another network or user agent) at the same
      time as the first, whether that triggers re-authentication, and whether a second
      login is detected or ends the first. The automatic steps already cover transport,
      cookie protection, and lifetime; leave this empty when the engagement does not need
      it. Keep token values inside evidence only.
