# WSTG v4.2 test index: every test, with a one-line summary.
# target_types: which target type runs the test (domain, fqdn).
# owasp_path: page under https://owasp.org/www-project-web-security-testing-guide/v42/4-Web_Application_Security_Testing/
# Scenarios (overview, criteria, steps) live in catalog/wstg/<id>.yaml.
wstg_version: "4.2"
tests:
  - id: WSTG-INFO-01
    category: INFO
    category_name: "Information Gathering"
    title: "Conduct Search Engine Discovery Reconnaissance for Information Leakage"
    summary: "Find sensitive information about the organization exposed by search engines, certificate logs, and web archives."
    target_types: [domain]
    owasp_path: 01-Information_Gathering/01-Conduct_Search_Engine_Discovery_Reconnaissance_for_Information_Leakage
  - id: WSTG-INFO-02
    category: INFO
    category_name: "Information Gathering"
    title: "Fingerprint Web Server"
    summary: "Identify the web server product and version from banners, headers, and error pages, and check for known vulnerabilities."
    target_types: [fqdn]
    owasp_path: 01-Information_Gathering/02-Fingerprint_Web_Server
  - id: WSTG-INFO-03
    category: INFO
    category_name: "Information Gathering"
    title: "Review Webserver Metafiles for Information Leakage"
    summary: "Review robots.txt, sitemaps, security.txt, and HTML meta tags for paths and information they disclose."
    target_types: [fqdn]
    owasp_path: 01-Information_Gathering/03-Review_Webserver_Metafiles_for_Information_Leakage
  - id: WSTG-INFO-04
    category: INFO
    category_name: "Information Gathering"
    title: "Enumerate Applications on Webserver"
    summary: "Enumerate applications hosted on the server: virtual hosts, subdomains, non-standard ports, and base paths."
    target_types: [domain, fqdn]
    owasp_path: 01-Information_Gathering/04-Enumerate_Applications_on_Webserver
  - id: WSTG-INFO-05
    category: INFO
    category_name: "Information Gathering"
    title: "Review Webpage Content for Information Leakage"
    summary: "Review page source, comments, and JavaScript for leaked information such as internal paths, keys, or credentials."
    target_types: [fqdn]
    owasp_path: 01-Information_Gathering/05-Review_Webpage_Content_for_Information_Leakage
  - id: WSTG-INFO-06
    category: INFO
    category_name: "Information Gathering"
    title: "Identify Application Entry Points"
    summary: "List the application's entry points: URLs, parameters, forms, headers, and cookies that accept input."
    target_types: [fqdn]
    owasp_path: 01-Information_Gathering/06-Identify_Application_Entry_Points
  - id: WSTG-INFO-07
    category: INFO
    category_name: "Information Gathering"
    title: "Map Execution Paths Through Application"
    summary: "Map the application's workflows and execution paths to plan test coverage."
    target_types: [fqdn]
    owasp_path: 01-Information_Gathering/07-Map_Execution_Paths_Through_Application
  - id: WSTG-INFO-08
    category: INFO
    category_name: "Information Gathering"
    title: "Fingerprint Web Application Framework"
    summary: "Identify the web framework and components from headers, cookies, HTML, and file paths."
    target_types: [fqdn]
    owasp_path: 01-Information_Gathering/08-Fingerprint_Web_Application_Framework
  - id: WSTG-INFO-09
    category: INFO
    category_name: "Information Gathering"
    title: "Fingerprint Web Application"
    summary: "Merged into WSTG-INFO-08 in WSTG v4.2."
    target_types: [fqdn]
    owasp_path: 01-Information_Gathering/09-Fingerprint_Web_Application
    merged_into: WSTG-INFO-08
  - id: WSTG-INFO-10
    category: INFO
    category_name: "Information Gathering"
    title: "Map Application Architecture"
    summary: "Map the application architecture: proxies, load balancers, CDN, WAF, back-end servers, and third-party services."
    target_types: [fqdn]
    owasp_path: 01-Information_Gathering/10-Map_Application_Architecture
  - id: WSTG-CONF-01
    category: CONF
    category_name: "Configuration and Deployment Management"
    title: "Test Network Infrastructure Configuration"
    summary: "Check the network and infrastructure around the web server: open ports, exposed services, and administrative interfaces."
    target_types: [fqdn]
    owasp_path: 02-Configuration_and_Deployment_Management_Testing/01-Test_Network_Infrastructure_Configuration
  - id: WSTG-CONF-02
    category: CONF
    category_name: "Configuration and Deployment Management"
    title: "Test Application Platform Configuration"
    summary: "Check the application platform for default files, sample applications, debug settings, and verbose logging."
    target_types: [fqdn]
    owasp_path: 02-Configuration_and_Deployment_Management_Testing/02-Test_Application_Platform_Configuration
  - id: WSTG-CONF-03
    category: CONF
    category_name: "Configuration and Deployment Management"
    title: "Test File Extensions Handling for Sensitive Information"
    summary: "Check how the server handles file extensions and whether sensitive file types can be downloaded."
    target_types: [fqdn]
    owasp_path: 02-Configuration_and_Deployment_Management_Testing/03-Test_File_Extensions_Handling_for_Sensitive_Information
  - id: WSTG-CONF-04
    category: CONF
    category_name: "Configuration and Deployment Management"
    title: "Review Old Backup and Unreferenced Files for Sensitive Information"
    summary: "Look for old, backup, and unreferenced files that disclose source code or sensitive data."
    target_types: [fqdn]
    owasp_path: 02-Configuration_and_Deployment_Management_Testing/04-Review_Old_Backup_and_Unreferenced_Files_for_Sensitive_Information
  - id: WSTG-CONF-05
    category: CONF
    category_name: "Configuration and Deployment Management"
    title: "Enumerate Infrastructure and Application Admin Interfaces"
    summary: "Find administrative interfaces of the infrastructure and the application, and check that they are protected."
    target_types: [fqdn]
    owasp_path: 02-Configuration_and_Deployment_Management_Testing/05-Enumerate_Infrastructure_and_Application_Admin_Interfaces
  - id: WSTG-CONF-06
    category: CONF
    category_name: "Configuration and Deployment Management"
    title: "Test HTTP Methods"
    summary: "Check which HTTP methods are allowed and whether risky methods (PUT, DELETE, TRACE) or method overriding work."
    target_types: [fqdn]
    owasp_path: 02-Configuration_and_Deployment_Management_Testing/06-Test_HTTP_Methods
  - id: WSTG-CONF-07
    category: CONF
    category_name: "Configuration and Deployment Management"
    title: "Test HTTP Strict Transport Security"
    summary: "Check that HTTP Strict Transport Security is set with a sufficient max-age."
    target_types: [fqdn]
    owasp_path: 02-Configuration_and_Deployment_Management_Testing/07-Test_HTTP_Strict_Transport_Security
  - id: WSTG-CONF-08
    category: CONF
    category_name: "Configuration and Deployment Management"
    title: "Test RIA Cross Domain Policy"
    summary: "Check Flash and Silverlight cross-domain policy files (crossdomain.xml, clientaccesspolicy.xml) for overly broad rules."
    target_types: [fqdn]
    owasp_path: 02-Configuration_and_Deployment_Management_Testing/08-Test_RIA_Cross_Domain_Policy
  - id: WSTG-CONF-09
    category: CONF
    category_name: "Configuration and Deployment Management"
    title: "Test File Permission"
    summary: "Check file and directory permissions on the server for overly permissive access."
    target_types: [fqdn]
    owasp_path: 02-Configuration_and_Deployment_Management_Testing/09-Test_File_Permission
  - id: WSTG-CONF-10
    category: CONF
    category_name: "Configuration and Deployment Management"
    title: "Test for Subdomain Takeover"
    summary: "Find DNS records and subdomains that point to unclaimed external resources and can be taken over."
    target_types: [domain, fqdn]
    owasp_path: 02-Configuration_and_Deployment_Management_Testing/10-Test_for_Subdomain_Takeover
  - id: WSTG-CONF-11
    category: CONF
    category_name: "Configuration and Deployment Management"
    title: "Test Cloud Storage"
    summary: "Check cloud storage (for example S3 buckets) used by the application for public read or write access."
    target_types: [fqdn]
    owasp_path: 02-Configuration_and_Deployment_Management_Testing/11-Test_Cloud_Storage
  - id: WSTG-IDNT-01
    category: IDNT
    category_name: "Identity Management"
    title: "Test Role Definitions"
    summary: "Identify the application's roles and check that permissions are separated as intended."
    target_types: [fqdn]
    owasp_path: 03-Identity_Management_Testing/01-Test_Role_Definitions
  - id: WSTG-IDNT-02
    category: IDNT
    category_name: "Identity Management"
    title: "Test User Registration Process"
    summary: "Check that the user registration process verifies identity and cannot be abused."
    target_types: [fqdn]
    owasp_path: 03-Identity_Management_Testing/02-Test_User_Registration_Process
  - id: WSTG-IDNT-03
    category: IDNT
    category_name: "Identity Management"
    title: "Test Account Provisioning Process"
    summary: "Check who can provision and de-provision accounts, and how."
    target_types: [fqdn]
    owasp_path: 03-Identity_Management_Testing/03-Test_Account_Provisioning_Process
  - id: WSTG-IDNT-04
    category: IDNT
    category_name: "Identity Management"
