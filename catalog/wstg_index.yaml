    target_types: [fqdn]
    owasp_path: 03-Identity_Management_Testing/04-Testing_for_Account_Enumeration_and_Guessable_User_Account
  - id: WSTG-IDNT-05
    category: IDNT
    category_name: "Identity Management"
    title: "Testing for Weak or Unenforced Username Policy"
