# Kinds of findings. A finding with a kind and a subject has the key
# (kind, normalized subject); a target never has two findings with the same key,
# whichever WSTG test they come from. Scenarios list the kinds they can produce
# (`finding_kinds:` in catalog/wstg/WSTG-*.yaml); the AI prompt shows them and the
# AI answers with a kind and a subject per finding, so the same problem found
# again (in another answer or another test) maps to the same key.
#
# Keys:
#   id       lower-case words joined by '-'
#   title    short name
#   subject  what the subject is, and how to write it (it is compared after
#            lower-casing and collapsing spaces, so write it the same way every time)
#
# "other" is always allowed: such findings have no key and are only checked by title.
kinds:
  # ---- information gathering ----------------------------------------------
  - id: version-disclosure
    title: Product version disclosed
    subject: "the product, as `vendor product` in CPE style, for example `apache http_server`, `php php`, `microsoft asp.net` (not the version; one finding per product)"
  - id: vulnerable-component
    title: Component with known vulnerabilities
    subject: "the product and version, as `vendor product version` in CPE style, for example `apache http_server 2.4.49`, `jquery jquery 1.12.4`"
  - id: sensitive-file-exposed
    title: Sensitive file or page publicly reachable or indexed
    subject: "the URL without query, for example `https://www.example.com/backup.zip`"
  - id: directory-listing
    title: Directory listing enabled
    subject: "the folder URL, for example `https://www.example.com/uploads/`"
  - id: metafile-information-leak
    title: Internal details in metafiles
    subject: "the file name, for example `robots.txt`, `sitemap.xml`, `security.txt`, `crossdomain.xml`"
  - id: unprotected-path
    title: Path opens without authentication
    subject: "the path, for example `/admin/`"
  - id: non-public-service-exposed
    title: Non-public host or service reachable from the Internet
    subject: "`host:port`, for example `dev.example.com:8080`"
  - id: client-code-information-leak
    title: Comments, debug notes, or internal details in client code
    subject: "the file or page path, for example `/js/app.js`"
  - id: secret-in-client-code
    title: Secret or credential in client code
    subject: "the file path and the secret's name, for example `/js/app.js api-key`"
  - id: public-source-map
    title: JavaScript source map publicly reachable
    subject: "the script path, for example `/js/app.js`"
  - id: unauthenticated-endpoint
    title: Endpoint answers without login
    subject: "the method and path, for example `get /api/users`"
  - id: hidden-function
    title: Unlinked function reachable
    subject: "the path, for example `/old/admin.php`"
  - id: infrastructure-information-leak
    title: Internal infrastructure details in responses
    subject: "the header or source, for example `x-backend-server header`"
  - id: internal-component-exposed
    title: Internal component reachable from outside
    subject: "`host:port` or the URL, for example `www.example.com:9200`"

  # ---- configuration and deployment ---------------------------------------
  - id: default-content
    title: Default page or sample application reachable
    subject: "the path, for example `/server-status`, `/examples/`"
  - id: admin-interface-exposed
    title: Administrative interface reachable from the Internet
    subject: "the URL without query, for example `https://www.example.com/admin/`"
  - id: http-method-enabled
    title: Risky HTTP method enabled or method override honored
    subject: "`host method`, for example `www.example.com trace`, `www.example.com put`, `www.example.com x-http-method-override`"
  - id: hsts-missing
    title: HSTS missing or weak
    subject: "the host, for example `www.example.com`"
  - id: cross-domain-policy-permissive
    title: Permissive cross-domain policy
    subject: "the file name, for example `crossdomain.xml`, `clientaccesspolicy.xml`"
  - id: file-permission
    title: Excessive file or folder permissions on the server
    subject: "the path on the server, for example `/var/www/html/.env`"
  - id: subdomain-takeover
    title: Subdomain can be taken over
    subject: "the host name, for example `old.example.com`"
  - id: cloud-storage-public
    title: Cloud storage readable or writable anonymously
    subject: "the bucket or container, as its host and path, for example `examplebucket.s3.amazonaws.com`"

  # ---- identity management -------------------------------------------------
  - id: role-separation
    title: Role has more permissions than defined, or roles are not defined
    subject: "the role and the function, for example `member user management`, or `no role definitions`"
  - id: registration-weakness
    title: Weakness in self-registration
    subject: "the weakness, for example `role parameter accepted`, `no e-mail verification`, `duplicate accounts`, `no bot protection`"
  - id: provisioning-weakness
    title: Weakness in account provisioning or de-provisioning
    subject: "the weakness, for example `session survives disabling`, `promotion beyond own role`, `no leaver process`"
  - id: account-enumeration
    title: Existing user names can be identified
    subject: "the function, for example `login`, `password reset`, `registration`, `wp-json users`"
  - id: weak-username-policy
    title: Guessable user names or user name variants accepted
    subject: "the weakness, for example `case variants accepted`, `first.last pattern`"

  # ---- cryptography --------------------------------------------------------
  - id: tls-weak-protocol
    title: Obsolete TLS or SSL protocol accepted
    subject: "`host:port protocol`, for example `www.example.com:443 tlsv1.0` (one finding per protocol)"
  - id: tls-weak-cipher
    title: Weak cipher suites or DH parameters accepted
    subject: "`host:port`, for example `www.example.com:443` (all weak suites in one finding)"
  - id: tls-certificate-problem
    title: Certificate problem
    subject: "`host:port problem`, for example `www.example.com:443 expired`, `www.example.com:443 hostname mismatch`"
  - id: tls-known-vulnerability
    title: Known TLS vulnerability
    subject: "`host:port name`, for example `www.example.com:443 heartbleed`"
  - id: no-https-redirect
    title: Plain HTTP not redirected to HTTPS
    subject: "the host, for example `www.example.com`"
  - id: cleartext-sensitive-data
    title: Sensitive data sent over plain HTTP
    subject: "the URL without query, for example `http://www.example.com/login`"
  - id: mixed-content
    title: Mixed content on HTTPS pages
    subject: "the page URL without query"
  - id: cookie-without-secure
    title: Cookie without the Secure flag
    subject: "the cookie name, for example `jsessionid`"
  - id: sensitive-data-in-url
    title: Sensitive values in URLs
    subject: "the parameter name, for example `token`"
  - id: padding-oracle
    title: Padding oracle
    subject: "where the value is sent and its name, for example `cookie auth`, `parameter state`"
  - id: reversible-encoding
    title: Encoding presented as encryption
    subject: "where the value is sent and its name, for example `cookie user`"
  - id: predictable-token
    title: Predictable token or session identifier
    subject: "where the token is sent and its name, for example `cookie sessionid`"
  - id: weak-cryptography
    title: Weak algorithm, mode, key, or random source
    subject: "what is weak, for example `password storage md5`, `ecb mode cookie auth`, `hardcoded key`"

  # ---- authentication ------------------------------------------------------
  - id: credentials-over-http
    title: Credentials transported over an unencrypted channel
    subject: "the login URL without query, for example `www.example.com/login`"
  - id: default-credentials
    title: Default or well-known credentials accepted
    subject: "the login point and account, for example `admin interface admin`"
  - id: weak-lockout
    title: Weak or missing brute-force lockout
    subject: "the login point, for example `web login`, `api /api/login`"
  - id: authentication-bypass
    title: Authentication can be bypassed
    subject: "the protected function and method, for example `force browsing /admin`, `parameter isAdmin`"
  - id: remember-password-weakness
    title: Insecure remember-password feature
    subject: "what is stored or weak, for example `password in local storage`, `token never expires`"
  - id: sensitive-page-cached
    title: Sensitive page cacheable by the browser
    subject: "the page URL without query, for example `www.example.com/account`"
  - id: weak-password-policy
    title: Weak password policy
    subject: "the function, for example `registration`, `password change`"
  - id: weak-security-question
    title: Weak security question or answer
    subject: "the function, for example `password reset`"
  - id: weak-password-reset
    title: Weak password change or reset function
    subject: "what is weak, for example `reset token reusable`, `change without current password`"
  - id: weaker-alternative-channel
    title: Weaker authentication in an alternative channel
    subject: "the channel or endpoint, for example `api /api/v1/login`, `mobile`"

  # ---- authorization -------------------------------------------------------
  - id: path-traversal
    title: Directory traversal
    subject: "the parameter, for example `file`, `page`"
  - id: file-inclusion
    title: Local or remote file inclusion
    subject: "the parameter, for example `template`, `include`"
  - id: authorization-bypass
    title: Authorization can be bypassed
    subject: "the function and method, for example `POST /admin/users`"
  - id: privilege-escalation
    title: Privilege escalation
    subject: "the direction and target, for example `vertical to admin`, `horizontal user :id`"
  - id: insecure-direct-object-reference
    title: Insecure direct object reference
    subject: "the reference and method, for example `GET /orders/:id`, `parameter id`"

  # ---- session management --------------------------------------------------
  - id: cookie-missing-httponly
    title: Session cookie without the HttpOnly flag
    subject: "the cookie name, for example `jsessionid`"
  - id: cookie-weak-samesite
    title: Session cookie with a weak or missing SameSite attribute
    subject: "the cookie name, for example `sessionid`"
  - id: cookie-scope-broad
    title: Cookie scoped too broadly (Domain or Path)
    subject: "the cookie name, for example `sessionid`"
  - id: session-fixation
    title: Session identifier not reissued at login (session fixation)
    subject: "the session cookie name, for example `phpsessid`"
  - id: session-token-exposed
    title: Session token exposed outside a cookie (URL, storage, log, or error page)
    subject: "where it appears, for example `url query`, `local storage`"
  - id: csrf
    title: State-changing request not protected against CSRF
    subject: "the request and method, for example `POST /account/email`"
  - id: weak-logout
    title: Logout does not invalidate the session server-side
    subject: "the application, for example `web session`"
  - id: weak-session-timeout
    title: Missing or excessive session timeout
    subject: "the kind, for example `idle timeout`, `absolute timeout`"
  - id: session-puzzling
    title: Session variable reused across flows (session puzzling)
    subject: "the flows and variable, for example `password reset to authenticated`"
  - id: session-hijacking
    title: Session token reusable from another device or network
    subject: "the session token, for example `cookie sessionid`"

  # ---- input validation ----------------------------------------------------
  - id: reflected-xss
    title: Reflected cross-site scripting
    subject: "the parameter and context, for example `q html body`, `ref attribute`"
  - id: stored-xss
    title: Stored cross-site scripting
    subject: "where it is stored and fires, for example `comment shown on article`"
  - id: http-parameter-pollution
    title: HTTP parameter pollution
    subject: "the parameter, for example `id`"
  - id: sql-injection
    title: SQL injection
    subject: "the input and type, for example `id error-based`, `search blind time`"
  - id: ldap-injection
    title: LDAP injection
    subject: "the input, for example `login username`"
  - id: xml-injection
    title: XML injection
    subject: "the input, for example `soap body`"
  - id: xxe
    title: XML external entity processing (XXE)
    subject: "the input, for example `upload docx`, `api xml body`"
  - id: ssi-injection
    title: Server-side include injection
    subject: "the input and page, for example `name field on page.shtml`"
  - id: xpath-injection
    title: XPath injection
    subject: "the input, for example `login username`"
  - id: mail-injection
    title: IMAP/SMTP header or command injection
    subject: "the field, for example `contact form subject`"
  - id: code-injection
    title: Code injection
    subject: "the input and language, for example `preview php`"
  - id: command-injection
    title: OS command injection
    subject: "the input, for example `host parameter`"
  - id: format-string-injection
    title: Format string injection
    subject: "the input, for example `name field`"
  - id: incubated-vulnerability
    title: Incubated (stored then later triggered) vulnerability
    subject: "the stored input and trigger, for example `profile value run by admin batch`"
  - id: http-response-splitting
    title: HTTP response splitting (CRLF injection)
    subject: "the parameter reflected into a header, for example `redirect`"
  - id: http-request-smuggling
    title: HTTP request smuggling
    subject: "the discrepancy, for example `CL.TE`, `TE.CL`"
  - id: request-parsing-weakness
    title: Weak handling of raw or malformed requests
    subject: "the case, for example `oversized header`, `duplicate header`"
  - id: host-header-injection
    title: Host header injection
    subject: "where it is reflected, for example `password reset link`, `absolute url`"
  - id: server-side-template-injection
    title: Server-side template injection
    subject: "the input, for example `name field`"
  - id: ssrf
    title: Server-side request forgery
    subject: "the input, for example `url parameter`, `image fetch`"

  # ---- error handling ------------------------------------------------------
  - id: error-information-disclosure
    title: Error page discloses internal details
    subject: "the trigger, for example `invalid id on /api/order`, `500 on /checkout`"

  # ---- business logic ------------------------------------------------------
  - id: business-logic-validation
    title: Business data not validated server-side
    subject: "the field and rule, for example `quantity negative`, `price client-set`"
  - id: forgeable-request
    title: Unintended parameter trusted from the client
    subject: "the parameter, for example `price`, `role`, `userId`"
  - id: integrity-check-missing
    title: Missing server-side integrity check
    subject: "the data, for example `unsigned total`, `jwt signature`"
  - id: process-timing
    title: Process timing abused or leaking information
    subject: "the function, for example `login timing`, `coupon race`"
  - id: function-limit-bypass
    title: Use-count limit not enforced
    subject: "the function, for example `coupon apply`, `otp attempts`"
  - id: workflow-bypass
    title: Workflow step skipped or reordered
    subject: "the flow, for example `checkout before payment`"
  - id: no-misuse-defense
    title: No detection or response to application misuse
    subject: "the behaviour, for example `rapid automated requests`"
  - id: unrestricted-file-upload
    title: Unexpected file type accepted on upload
    subject: "the upload and type, for example `avatar .php`, `attachment .svg`"
  - id: malicious-file-upload
    title: Malicious file stored or executable
    subject: "the upload, for example `web shell in /uploads`, `eicar not scanned`"

  # ---- client-side ---------------------------------------------------------
  - id: dom-xss
    title: DOM-based cross-site scripting
    subject: "the source and sink, for example `location.hash to innerHTML`"
  - id: client-js-execution
    title: Attacker-controlled JavaScript execution (client-side)
    subject: "the sink, for example `eval`, `setTimeout`"
  - id: html-injection
    title: HTML injection
    subject: "the input, for example `name field`"
  - id: client-open-redirect
    title: Client-side open redirect
    subject: "the parameter, for example `next`, `url`"
  - id: css-injection
    title: CSS injection
    subject: "the input, for example `theme parameter`"
  - id: client-resource-manipulation
    title: Client-side resource location controllable
    subject: "the resource, for example `script src from parameter`"
  - id: cors-misconfiguration
    title: Overly permissive CORS configuration
    subject: "the endpoint, for example `/api`"
  - id: cross-site-flashing
    title: Cross-site flashing in Flash content
    subject: "the swf, for example `player.swf`"
  - id: clickjacking
    title: Page can be framed (clickjacking)
    subject: "the page URL without query, for example `www.example.com/transfer`"
  - id: websocket-weakness
    title: WebSocket weakness (transport, origin, or authorization)
    subject: "the endpoint, for example `wss://www.example.com/ws`"
  - id: web-messaging-weakness
    title: Unsafe postMessage handling
    subject: "where, for example `message handler on dashboard`"
  - id: browser-storage-sensitive-data
    title: Sensitive data in browser storage
    subject: "the item, for example `localStorage accessToken`"
  - id: cross-site-script-inclusion
    title: Cross-site script inclusion (XSSI)
    subject: "the endpoint, for example `/api/user.json`"

  # ---- api testing ---------------------------------------------------------
  - id: graphql-exposure
    title: GraphQL schema exposure or query abuse
    subject: "the endpoint and issue, for example `/graphql introspection`, `/graphql no depth limit`"
