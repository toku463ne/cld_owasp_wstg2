{% extends "base.html" %}
{% block title %}Log in · WSTG Runner{% endblock %}
{% block body %}
<div class="login">
<h2>Log in</h2>
<form method="post" class="stack">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <p><label>User name <input name="username" autocomplete="username" autofocus required></label></p>
  <p><label>Password <input name="password" type="password" autocomplete="current-password" required></label></p>
  <p><button>Log in</button></p>
</form>
</div>
{% endblock %}
